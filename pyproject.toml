[project]
name = "channels"
version = "0.1.0a5"
description = ""
readme = "README.md"
requires-python = ">=3.14"
keywords = [
    "django",
    "async"
]
authors = [
  {name = "John Pendenque", email = "pendenquejohn@gmail.com"},
]
maintainers = [
  {name = "John Pendenque", email = "pendenquejohn@gmail.com"}
]

dependencies = [
    "async-timeout>=5.0.1",
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = [
    "django>=6.1.3",
    "pytest>=9.2.0",
    "pytest-aio>=2.1.7",
    "pytest-cov>=7.1.0",
    "pytest-crayons>=0.0.9",
    "pytest-datafiles>=3.0.1",
    "pytest-django>=4.14.0",
    "pytest-env>=1.8.5",
    "pytest-reportlog>=1.0.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.5",
]

# For UV
[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.uv.build-backend]
source-exclude = [
    "tests/**",
    "docs/**",
    "*.log",
    "**/.DS_Store",
    "conftest.py"
]

[tool.pyright]
typeCheckingMode = "basic"
reportMissingImports = true
reportUntypedBaseClass = true
